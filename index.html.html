<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 09 - Hello World</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      background: #f4f4f4;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 22px 10px 28px;
      background: #fff;
      border: 1px solid #ddd;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }

    .hello {
      margin: 0 0 22px;
      padding: 3px 7px;
      font-size: 32px;
      line-height: 1.35;
      font-weight: bold;
      color: #000;
    }

    .first {
      background: lightblue;
      border: 8px double tomato;
    }

    .second {
      background: yellow;
      border: 3px solid #168bff;
      border-radius: 12px;
    }

    .third {
      margin-bottom: 0;
      background: mediumseagreen;
      border: 6px dotted gray;
    }

    .note {
      width: min(100%, 560px);
      margin: 24px auto 0;
      color: #e32626;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-style: italic;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .hello {
        font-size: 26px;
      }

      .note {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="hello first">Hello World</h1>
    <h1 class="hello second">Hello World</h1>
    <h1 class="hello third">Hello World</h1>
  </main>

  <p class="note">* Note colors, backgrounds and borders</p>
</body>
</html>
